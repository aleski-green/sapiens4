<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1ede3">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/app-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="/corpora.css"><link rel="stylesheet" href="/remote-install.css">
  <title>sapi*4 ◠‿◠ AI — Workspace</title>
  <link rel="stylesheet" href="/workspace/styles.css"><link rel="stylesheet" href="/live.css">
  <link rel="stylesheet" href="/assets/sapi-theme.css">
</head>
<body class="sapi-workspace">
  <div class="app">
    <header class="app-header">
      <a class="wordmark" href="#" aria-label="Sapiens4 home"><span class="brand-name">Sapiens4</span></a>
      <button class="icon-button menu-button" id="app-menu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="pane-controls" aria-label="Panel visibility">
        <button class="pane-toggle" data-toggle-pane="sidebar" aria-controls="chat-list-panel" aria-pressed="true" aria-label="Hide chat list" title="Hide chat list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path class="pane-fill" d="M4 5h5v14H4z"/><path d="M12 9h6M12 13h6M12 17h4"/></svg></button>
        <button class="pane-toggle" data-toggle-pane="chat" aria-controls="chat-panel" aria-pressed="true" aria-label="Hide chat" title="Hide chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H9l-5 4z"/><path class="pane-fill" d="M7 7h10v7H7z"/></svg></button>
        <button class="pane-toggle" data-toggle-pane="workspace" aria-controls="workspace-panel" aria-pressed="true" aria-label="Hide workspace" title="Hide workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path class="pane-fill" d="M12 10h8v9h-8z"/></svg></button>
      </nav>
      <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">☾</button>
      <button id="corpora-picker" class="connection-button" aria-controls="corpora-menu" aria-expanded="false"><span id="corpora-location">Local</span><svg class="activity-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true" focusable="false"><path d="m4.5 6.25 3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="connection-status connection-button" id="connection-status" aria-controls="corpora-status-menu" aria-expanded="false" aria-live="polite" data-online="false"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">Connecting…</span><svg class="activity-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true" focusable="false"><path d="m4.5 6.25 3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <section id="corpora-menu" class="corpora-popover" aria-label="Corpora" hidden>
        <div class="corpora-menu-heading"><strong>Corpora</strong><button id="corpora-menu-close" aria-label="Close corpora menu">×</button></div>
        <div class="corpora-columns"><span>Location</span><span>Name</span><span>Status</span><span>Device</span><span class="corpora-remote-column">Remote</span></div>
        <div id="corpora-rows"></div>
        <div class="corpora-actions"><button id="create-local-corpora" hidden>＋ Create new local corpora</button><button id="connect-remote-corpora">＋ Connect remote corpora</button></div>
        <label class="corpora-archive-toggle"><input id="corpora-archived" type="checkbox"> Show archived corporas</label>
      </section>
      <div id="corpora-status-menu" class="corpora-popover status-popover" hidden></div>
    </header>
    <section id="corpora-empty" class="corpora-empty" hidden><h1>Your corpora</h1><p>Connect to your Sapis on another computer.</p><button id="empty-connect-corpora">Connect remote corpora</button><button id="empty-create-corpora" hidden>Create local corpora</button></section>
    <p id="corpora-startup-feedback" role="status"></p>
    <!-- Previous cached clients bind this button; the current installer replaces the fallback. -->
    <section id="mobile-install-gate" aria-label="Install Sapiens4" hidden><div class="install-card"><span class="install-brand">Sapiens4</span><h1>Add to Home Screen</h1><p>Install to connect your corpora.</p><button id="mobile-install-action" type="button">Show me how</button><a href="https://sapiens4.ai/help?q=add2homescreen" target="_blank" rel="noopener noreferrer">Need help? ↗</a></div></section>
    <div class="main-grid">
      <aside class="sidebar" id="chat-list-panel" aria-label="Chat list">
        <div class="sidebar-heading"><h1 id="corpora-identity" class="corpora-identity">Connecting…</h1><span id="agent-count" aria-label="Sapi count">0</span><div class="sidebar-actions"><button class="icon-button" id="search-toggle" aria-label="Search Corpora" aria-controls="corpora-search" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button class="icon-button" id="add-agent" aria-label="Create through Chief">＋</button></div></div>
        <div class="scope-switch" aria-label="Agent views"><button data-scope="all" class="active">All</button><button data-scope="sapis">Sapis</button><button data-scope="groups">Groups</button></div>
        <label class="search-field" id="corpora-search"><span aria-hidden="true">⌕</span><input id="agent-search" type="search" placeholder="Find a Sapi or Group…" aria-label="Search agents"><kbd>/</kbd></label>
        <div id="agent-list" class="agent-list"></div>
        <footer class="sidebar-bottom">
          <div class="resource-card"><button id="resource-button" class="resource-open" aria-label="Open shared computer"><span class="computer-icon" aria-hidden="true">▣</span><strong>SHARED COMPUTER</strong><span class="status-dot" id="resource-status"></span></button><small id="resource-owner">Connecting…</small></div>
        </footer>
      </aside>
      <section class="conversation" id="chat-panel" aria-label="Agent conversation">
        <div class="agent-heading" id="agent-heading"></div>
        <nav class="conversation-tabs" aria-label="Agent activity"><button data-panel="chat" class="active">Chat</button><button data-panel="work">Work</button><button data-panel="updates">Updates</button></nav>
        <div class="conversation-body" id="conversation-body"></div>
        <div class="composer-area" id="composer-area">
          <div id="attachment-chip"></div>
          <form class="composer" id="chat-form"><textarea rows="2" id="message-input" maxlength="16000" placeholder="Message your Sapi…" aria-label="Message agent"></textarea><div class="composer-bottom"><button type="button" id="attach-button" class="icon-button" aria-label="Add attachment">＋</button><button type="submit" class="send-button" aria-label="Send message">↑</button></div></form>
        </div>
      </section>
      <main class="workspace" id="workspace-panel" aria-label="Agent workspace">
        <div class="browser-tabs-wrap"><div id="browser-tabs" class="browser-tabs" aria-label="Workspace tabs"></div><button id="browser-overflow" aria-label="All open tabs" aria-expanded="false" hidden></button><button id="add-tab" class="add-tab" aria-label="Add workspace tab">＋</button><button class="icon-button" id="workspace-menu" aria-label="Workspace options" aria-expanded="false">···</button></div>
        <form id="browser-address-form" class="browser-address-bar" hidden><input id="browser-address" aria-label="URL or file path" placeholder="URL or file path" autocomplete="off" spellcheck="false"><button type="submit" aria-label="Open address">→</button></form>
        <div id="browser-menu" class="browser-menu" role="dialog" aria-label="Workspace options" hidden>
          <div id="browser-options">
            <div id="workspace-owner" class="workspace-owner"></div><button data-edit-address>URL or file path…</button><button id="open-file">Open file…</button>
            <div class="browser-menu-row"><button data-browser-action="back">← Back</button><button data-browser-action="forward">Forward →</button><button data-browser-action="reload">Reload</button></div>
            <div class="browser-menu-row"><span>Zoom</span><button data-zoom="-0.1" aria-label="Zoom out">−</button><button id="browser-zoom" data-zoom="reset" aria-label="Reset zoom">100%</button><button data-zoom="0.1" aria-label="Zoom in">＋</button></div>
            <div class="browser-menu-label">Bookmarks</div><div id="browser-bookmarks"></div>
          </div>
          <div id="browser-all-tabs" hidden></div>
          <span id="browser-status" role="status"></span>
        </div>
        <div id="workspace-content" class="workspace-content"></div>
        <footer class="workspace-footer"><a href="https://sapiens4.ai" target="_blank" rel="noopener noreferrer">sapiens4.ai ↗</a></footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><span class="tiny-label" id="modal-eyebrow">SAPI WORKSPACE</span><button class="icon-button" id="close-modal" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="corpora-dialog" aria-labelledby="corpora-dialog-title"><div class="corpora-menu-heading"><h2 id="corpora-dialog-title"></h2><button id="corpora-dialog-close" aria-label="Close">×</button></div><div id="corpora-dialog-body"></div></dialog>
  <dialog id="corpora-notice" aria-label="Connection notice"><p id="corpora-notice-text"></p><button id="corpora-notice-close">OK</button></dialog>
  <script src="/remote-vendor.js"></script><script src="/remote-code.js"></script><script src="/remote-session.js"></script><script src="/remote-transport.js"></script><script src="/remote-install.js"></script><script src="/remote-onboarding.js"></script><script src="/corpora.js"></script>
  <script src="/assets/sapi-theme.js"></script>
  <script src="/workspace/app.js"></script>
</body>
</html>
