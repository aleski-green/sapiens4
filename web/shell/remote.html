<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sapiens4"><title>Sapiens4</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/app-icon-180.png"><link rel="icon" type="image/png" href="/app-icon-192.png"><link rel="stylesheet" href="/workspace/styles.css"><link rel="stylesheet" href="/assets/sapi-theme.css"><link rel="stylesheet" href="/live.css"><link rel="stylesheet" href="/remote.css"><link rel="stylesheet" href="/remote-install.css"></head>
<body class="sapi-workspace pairing-page"><main>
<header class="pairing-header"><span>CORPORA</span><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">☾</button></header>
<section id="pair-panel"><h1>Connect</h1>
<form id="corpora-form"><label for="corpora-address">CORPORA ID</label><input id="corpora-address" placeholder="sapi4_abc123qwe" pattern="sapi4_[a-z]{3}[0-9]{3}[a-z]{3}" maxlength="15" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required><button id="find-corpora" type="submit">Continue</button></form>
<div id="qr-step" hidden><div class="address-row"><code id="selected-address"></code><button id="change-corpora" type="button" class="secondary">Change</button></div><p>Scan the QR from desktop <strong>Connect phone</strong>.</p><button id="scan-qr" type="button">Scan QR</button><label class="upload" for="qr-file">Upload QR<input id="qr-file" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="muted">QR valid for 3 days.</p></div>
<div id="scanner" hidden><video id="qr-camera" autoplay playsinline muted aria-label="QR camera preview"></video><button id="stop-scan" class="secondary" type="button">Cancel scan</button></div></section>
<section id="verify-panel" hidden><h1>Codes match?</h1><p>Confirm on your desktop.</p><code id="confirmation-code" aria-label="Confirmation code"></code><p class="muted">This app can control your CORPORA until revoked.</p></section>
<p id="status" role="status" aria-live="polite"></p><button id="forget" type="button" class="secondary" hidden>Cancel connection</button>
</main><script src="/assets/sapi-theme.js"></script><script src="/remote-vendor.js"></script><script src="/remote-code.js"></script><script src="/remote-session.js"></script><script src="/remote-install.js"></script><script src="/remote-onboarding.js"></script><script src="/remote.js"></script></body></html>
