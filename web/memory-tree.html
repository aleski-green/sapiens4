<div id="json-tree-lab">
  <div class="jt-shell">
    <header class="jt-header">
      <div class="jt-status" aria-live="polite">
        <span id="jt-node-count">0 nodes</span>
        <span id="jt-visible-count">0 visible</span>
      </div>
    </header>

    <div class="jt-workspace">
      <div id="jt-error" class="jt-error" role="alert" hidden></div>
      <section class="jt-browser" aria-labelledby="jt-tree-title">
        <div class="jt-panel-head jt-tree-head">
          <h2 id="jt-tree-title">Tree</h2>
          <div class="jt-depth-controls" aria-label="Tree depth controls">
            <label>
              Open depth
              <select id="jt-depth-select">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
            <button id="jt-collapse" type="button">Collapse all</button>
          </div>
        </div>

        <div class="jt-search-row">
          <label class="jt-search-label">
            <span class="sr-only">Search keys, paths, and values</span>
            <input id="jt-search" type="search" placeholder="Search keys, paths, values…" autocomplete="off">
          </label>
          <span id="jt-match-count" class="jt-match-count" aria-live="polite">No filter</span>
          <button id="jt-prev" type="button" aria-label="Previous match" disabled>↑</button>
          <button id="jt-next" type="button" aria-label="Next match" disabled>↓</button>
        </div>

        <div id="jt-tree-scroll" class="jt-tree-scroll" role="tree" aria-label="Interactive JSON tree">
          <div id="jt-tree-spacer" class="jt-tree-spacer">
            <div id="jt-tree-rows" class="jt-tree-rows"></div>
          </div>
        </div>

        <div class="jt-inspector" aria-live="polite">
          <div class="jt-path-wrap">
            <span class="jt-label">Selected path</span>
            <code id="jt-selected-path">$</code>
          </div>
          <div class="jt-inspector-value">
            <span id="jt-selected-type" class="jt-type">obj</span>
            <code id="jt-selected-value">Select a row to inspect its full value.</code>
          </div>
          <button id="jt-copy" type="button">Copy path</button>
        </div>

      </section>
    </div>
  </div>
</div>



<script>
(() => {
  const root = document.getElementById('json-tree-lab');
  const el = id => root.querySelector('#' + id);
  const errorBox = el('jt-error');
  const scroll = el('jt-tree-scroll');
  const spacer = el('jt-tree-spacer');
  const rowsLayer = el('jt-tree-rows');
  const search = el('jt-search');
  const rowHeight = 30;
  const overscan = 8;
  let data = null;
  let nodeIndex = new Map();
  let expanded = new Set();
  let visibleRows = [];
  let matches = [];
  let matchIndex = -1;
  let selectedPath = '$';

  const isContainer = value => value !== null && typeof value === 'object';
  const typeOf = value => value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
  const shortType = type => type === 'array' ? 'arr' : type === 'object' ? 'obj' : type;
  const childCount = value => Array.isArray(value) ? value.length : Object.keys(value).length;
  const keyPath = (parentPath, key, parentIsArray) => parentIsArray
    ? `${parentPath}[${key}]`
    : /^[A-Za-z_$][\w$]*$/.test(key) ? `${parentPath}.${key}` : `${parentPath}[${JSON.stringify(key)}]`;
  const shortValue = value => {
    if (Array.isArray(value)) return `[${value.length}]`;
    if (value && typeof value === 'object') return `{${Object.keys(value).length}}`;
    if (typeof value === 'string') return JSON.stringify(value.length > 90 ? value.slice(0, 87) + '…' : value);
    return String(value);
  };
  const fullValue = value => isContainer(value) ? JSON.stringify(value, null, 2) : JSON.stringify(value);
  const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));

  function indexData(value, path = '$', key = '$', depth = 0, parentPath = null, parentIsArray = false) {
    const node = { value, path, key: String(key), depth, parentPath, parentIsArray, type: typeOf(value) };
    nodeIndex.set(path, node);
    if (isContainer(value)) {
      Object.entries(value).forEach(([childKey, childValue]) => {
        indexData(childValue, keyPath(path, childKey, Array.isArray(value)), childKey, depth + 1, path, Array.isArray(value));
      });
    }
  }

  function expandToDepth(depth) {
    expanded.clear();
    nodeIndex.forEach(node => {
      if (isContainer(node.value) && node.depth < depth) expanded.add(node.path);
    });
    rebuildVisible();
  }

  function rebuildVisible() {
    const result = [];
    const walk = path => {
      const node = nodeIndex.get(path);
      if (!node) return;
      result.push(node);
      if (isContainer(node.value) && expanded.has(path)) {
        Object.keys(node.value).forEach(key => walk(keyPath(path, key, Array.isArray(node.value))));
      }
    };
    walk('$');
    visibleRows = result;
    spacer.style.height = `${visibleRows.length * rowHeight}px`;
    el('jt-visible-count').textContent = `${visibleRows.length.toLocaleString()} visible`;
    renderWindow();
  }

  function renderWindow() {
    const start = Math.max(0, Math.floor(scroll.scrollTop / rowHeight) - overscan);
    const end = Math.min(visibleRows.length, Math.ceil((scroll.scrollTop + scroll.clientHeight) / rowHeight) + overscan);
    rowsLayer.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for (let i = start; i < end; i++) {
      const node = visibleRows[i];
      const container = isContainer(node.value);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'jt-row' + (matches.includes(node.path) ? ' jt-match' : '');
      row.style.top = `${i * rowHeight}px`;
      row.style.paddingLeft = `${10 + node.depth * 18}px`;
      row.dataset.path = node.path;
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(node.depth + 1));
      row.setAttribute('aria-selected', String(node.path === selectedPath));
      if (container) row.setAttribute('aria-expanded', String(expanded.has(node.path)));
      const displayKey = node.path === '$' ? '$ root' : node.parentIsArray ? `[${node.key}]` : node.key;
      const renderedValue = container
        ? `<span class="jt-kind ${node.type}">${shortType(node.type)}</span><span class="jt-count">${escapeHtml(shortValue(node.value))}</span>`
        : `<span class="jt-preview ${node.type}">${escapeHtml(shortValue(node.value))}</span>`;
      row.innerHTML = `${node.depth ? `<span class="jt-guide" style="left:${18 + (node.depth - 1) * 18}px"></span>` : ''}` +
        `<span class="jt-chevron">${container ? (expanded.has(node.path) ? '▾' : '▸') : '·'}</span>` +
        `<span class="jt-pair"><span class="jt-key jt-key-${node.type}">${escapeHtml(displayKey)}</span>` +
        `<span class="jt-sep">${node.path === '$' ? '' : ':'}</span>${renderedValue}</span>`;
      row.addEventListener('click', () => selectNode(node.path, true));
      row.addEventListener('keydown', event => handleRowKey(event, node.path, i));
      fragment.appendChild(row);
    }
    rowsLayer.appendChild(fragment);
  }

  function handleRowKey(event, path, index) {
    const node = nodeIndex.get(path);
    if (event.key === 'ArrowRight' && isContainer(node.value) && !expanded.has(path)) {
      event.preventDefault(); expanded.add(path); rebuildVisible(); focusPath(path);
    } else if (event.key === 'ArrowLeft' && expanded.has(path)) {
      event.preventDefault(); expanded.delete(path); rebuildVisible(); focusPath(path);
    } else if (event.key === 'ArrowLeft' && node.parentPath) {
      event.preventDefault(); focusPath(node.parentPath);
    } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const next = Math.max(0, Math.min(visibleRows.length - 1, index + (event.key === 'ArrowDown' ? 1 : -1)));
      focusPath(visibleRows[next].path);
    }
  }

  function focusPath(path) {
    const index = visibleRows.findIndex(row => row.path === path);
    if (index < 0) return;
    const top = index * rowHeight;
    if (top < scroll.scrollTop || top + rowHeight > scroll.scrollTop + scroll.clientHeight) scroll.scrollTop = Math.max(0, top - rowHeight * 2);
    renderWindow();
    requestAnimationFrame(() => rowsLayer.querySelector(`[data-path="${CSS.escape(path)}"]`)?.focus());
  }

  function selectNode(path, toggle) {
    const node = nodeIndex.get(path);
    if (!node) return;
    selectedPath = path;
    if (toggle && isContainer(node.value)) {
      if (expanded.has(path)) expanded.delete(path); else expanded.add(path);
      rebuildVisible();
    } else renderWindow();
    el('jt-selected-path').textContent = path;
    el('jt-selected-type').textContent = shortType(node.type);
    const value = isContainer(node.value)
      ? `${node.type === 'array' ? 'Array' : 'Object'} with ${childCount(node.value).toLocaleString()} direct ${childCount(node.value) === 1 ? 'child' : 'children'}`
      : fullValue(node.value);
    el('jt-selected-value').textContent = value.length > 260 ? value.slice(0, 257) + '…' : value;
  }

  function runSearch() {
    const query = search.value.trim().toLowerCase();
    matches = [];
    matchIndex = -1;
    if (query) {
      nodeIndex.forEach(node => {
        const primitive = isContainer(node.value) ? '' : String(node.value);
        if (`${node.key} ${node.path} ${primitive}`.toLowerCase().includes(query)) matches.push(node.path);
      });
    }
    const has = matches.length > 0;
    el('jt-prev').disabled = !has;
    el('jt-next').disabled = !has;
    el('jt-match-count').textContent = query ? `${matches.length.toLocaleString()} match${matches.length === 1 ? '' : 'es'}` : 'No filter';
    renderWindow();
    if (has) goToMatch(1);
  }

  function goToMatch(step) {
    if (!matches.length) return;
    matchIndex = (matchIndex + step + matches.length) % matches.length;
    const path = matches[matchIndex];
    let parent = nodeIndex.get(path)?.parentPath;
    while (parent) { expanded.add(parent); parent = nodeIndex.get(parent)?.parentPath; }
    rebuildVisible();
    selectNode(path, false);
    const index = visibleRows.findIndex(row => row.path === path);
    if (index >= 0) scroll.scrollTop = Math.max(0, index * rowHeight - scroll.clientHeight / 2);
    renderWindow();
  }

  function applyJson(value) {
    try {
      data = JSON.parse(value);
      nodeIndex = new Map();
      indexData(data);
      selectedPath = '$';
      errorBox.hidden = true;
      el('jt-node-count').textContent = `${nodeIndex.size.toLocaleString()} nodes`;
      search.value = '';
      matches = [];
      el('jt-match-count').textContent = 'No filter';
      el('jt-prev').disabled = true;
      el('jt-next').disabled = true;
      scroll.scrollTop = 0;
      expandToDepth(Number(el('jt-depth-select').value));
      selectNode('$', false);
    } catch (error) {
      errorBox.textContent = `Invalid JSON: ${error.message}`;
      errorBox.hidden = false;
    }
  }

  el('jt-depth-select').addEventListener('change', event => expandToDepth(Number(event.target.value)));
  el('jt-collapse').addEventListener('click', () => { expanded = new Set(); rebuildVisible(); });
  scroll.addEventListener('scroll', renderWindow, { passive: true });
  search.addEventListener('input', runSearch);
  search.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); goToMatch(event.shiftKey ? -1 : 1); }
  });
  el('jt-prev').addEventListener('click', () => goToMatch(-1));
  el('jt-next').addEventListener('click', () => goToMatch(1));
  el('jt-copy').addEventListener('click', async () => {
    const button = el('jt-copy');
    try { await navigator.clipboard.writeText(selectedPath); button.textContent = 'Copied'; }
    catch (_) { button.textContent = selectedPath; }
    setTimeout(() => button.textContent = 'Copy path', 1200);
  });
  root.addEventListener('keydown', event => {
    if (event.key === '/' && document.activeElement !== search) { event.preventDefault(); search.focus(); }
  });
  new ResizeObserver(renderWindow).observe(scroll);

  let current = null;
  window.addEventListener('message', event => {
    if (event.source !== parent || event.data?.type !== 'sapiens-memory') return;
    root.style.colorScheme = event.data.dark ? 'dark' : 'light';
    const value = JSON.stringify(event.data.memx);
    if (value === current) return;
    current = value; applyJson(value);
  });
  parent.postMessage({type:'sapiens-memory-ready'}, '*');

})();
</script>
