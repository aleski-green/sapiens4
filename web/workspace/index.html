<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ede3">
  <title>sapi*4 ◠‿◠ AI — Workspace</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="/live.css">
  <link rel="stylesheet" href="../assets/sapi-theme.css">
</head>
<body class="sapi-workspace">
  <div class="app">
    <header class="app-header">
      <a class="wordmark" href="#" aria-label="sapi * 4 ◠‿◠ AI home"><span class="brand-name">sapi * 4</span><span class="brand-face">◠‿◠</span><span class="brand-ai">AI</span></a>
      <button class="icon-button menu-button" id="app-menu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="pane-controls" aria-label="Panel visibility">
        <button class="pane-toggle" data-toggle-pane="sidebar" aria-controls="chat-list-panel" aria-pressed="true" aria-label="Hide chat list" title="Hide chat list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path class="pane-fill" d="M4 5h5v14H4z"/><path d="M12 9h6M12 13h6M12 17h4"/></svg></button>
        <button class="pane-toggle" data-toggle-pane="chat" aria-controls="chat-panel" aria-pressed="true" aria-label="Hide chat" title="Hide chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H9l-5 4z"/><path class="pane-fill" d="M7 7h10v7H7z"/></svg></button>
        <button class="pane-toggle" data-toggle-pane="workspace" aria-controls="workspace-panel" aria-pressed="true" aria-label="Hide workspace" title="Hide workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path class="pane-fill" d="M12 10h8v9h-8z"/></svg></button>
      </nav>
      <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">☾</button>
      <button class="pill" id="autonomy-button"><span>✦</span> <span id="autonomy-label">Connecting…</span> <span>⌄</span></button>
      <button class="user-avatar" id="profile-button" aria-label="Workspace settings">Admin</button>
    </header>
    <div class="main-grid">
      <aside class="sidebar" id="chat-list-panel" aria-label="Chat list">
        <div class="sidebar-heading"><h1>CORPORA<span id="agent-count">0</span></h1><button class="icon-button" id="add-agent" aria-label="Add an agent">＋</button></div>
        <div class="scope-switch" aria-label="Agent views"><button data-scope="all" class="active">All</button><button data-scope="sapis">Sapis</button><button data-scope="groups">Groups</button></div>
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="agent-search" type="search" placeholder="Find a Sapi…" aria-label="Search agents"><kbd>/</kbd></label>
        <div id="agent-list" class="agent-list"></div>
        <footer class="sidebar-bottom">
          <div class="resource-card"><button id="resource-button" class="resource-open" aria-label="Open shared computer"><span class="computer-icon" aria-hidden="true">▣</span><strong>SHARED COMPUTER</strong><span class="status-dot" id="resource-status"></span></button><small id="resource-owner">Connecting…</small></div>
        </footer>
      </aside>
      <section class="conversation" id="chat-panel" aria-label="Agent conversation">
        <div class="agent-heading" id="agent-heading"></div>
        <nav class="conversation-tabs" aria-label="Agent activity"><button data-panel="chat" class="active">Chat</button><button data-panel="tasks" disabled aria-disabled="true" title="Inactive">Tasks</button><button data-panel="cron" disabled aria-disabled="true" title="Inactive">Jobs</button><button data-panel="notes">Notes</button><button data-panel="log">Log <span class="log-dot"></span></button></nav>
        <div class="conversation-body" id="conversation-body"></div>
        <div class="composer-area" id="composer-area">
          <div id="attachment-chip"></div>
          <form class="composer" id="chat-form"><textarea rows="2" id="message-input" placeholder="Message your Sapi…" aria-label="Message agent"></textarea><div class="composer-bottom"><button type="button" id="attach-button" class="icon-button" aria-label="Add attachment">＋</button><button type="submit" class="send-button" aria-label="Send message">↑</button></div></form>
          <div class="composer-hint"><span>Autonomous</span><span>Enter ↵</span></div>
        </div>
      </section>
      <main class="workspace" id="workspace-panel" aria-label="Agent workspace">
        <div class="workspace-heading"><span class="workspace-owner" id="workspace-owner"></span><button class="icon-button" id="workspace-menu" aria-label="Workspace options">···</button></div>
        <div class="browser-tabs-wrap"><div id="browser-tabs" class="browser-tabs" aria-label="Workspace tabs"></div><button id="add-tab" class="add-tab" aria-label="Add workspace tab">＋</button></div>
        <form id="browser-address-form" class="browser-address-bar"><button type="button" class="icon-button" id="reload-page" aria-label="Reload page" title="Reload page">↻</button><input id="browser-address" aria-label="Page address" placeholder="Enter a URL" autocomplete="off" spellcheck="false"><a id="open-page" aria-label="Open page in new tab" title="Open page in new tab" target="_blank" rel="noopener noreferrer" hidden>↗</a></form>
        <div id="workspace-content" class="workspace-content"></div>
        <footer class="workspace-footer"><a href="https://sapiens4.ai" target="_blank" rel="noopener noreferrer">sapiens4.ai ↗</a></footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><span class="tiny-label" id="modal-eyebrow">SAPI WORKSPACE</span><button class="icon-button" id="close-modal" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../assets/sapi-theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
