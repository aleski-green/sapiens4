name: Integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Test dependencies
        run: |
          python -m pip install -r spec/requirements.txt
          npm ci --prefix tests --ignore-scripts
      - name: Service, CLI, browser and platform contracts
        env:
          SAPIENS_PYTHON: python
        run: bundle exec rspec
  blindly:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: swift build --package-path blindly4
      - run: swift run --package-path blindly4 blindly4 --self-test
      - run: swift run --package-path blindly4 blindly4 schema
      - name: Build macOS desktop app
        run: ./macos/build.sh
