name: Integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Integration tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax
        run: |
          python -c 'from sapiens.corpora.host.assets import javascript; from pathlib import Path; Path("/tmp/sapiens4-app.js").write_text(javascript())'
          node --check /tmp/sapiens4-app.js
          node tests/chat_links.test.cjs
          node tests/workspace_merge.test.cjs
          node tests/notes.test.cjs
          node tests/tasks.test.cjs
  blindly:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: swift build --package-path blindly4
      - run: swift run --package-path blindly4 blindly4 --self-test
      - run: swift run --package-path blindly4 blindly4 schema
      - name: Desktop navigation, readiness and update tests
        run: |
          swiftc macos/NavigationPolicy.swift macos/NavigationPolicyTests.swift -o /tmp/navigation-tests
          /tmp/navigation-tests
          swiftc macos/ServerReadiness.swift macos/ServerReadinessTests.swift -o /tmp/readiness-tests
          /tmp/readiness-tests
          swiftc macos/DesktopUpdate.swift macos/DesktopUpdateTests.swift -o /tmp/desktop-update-tests
          /tmp/desktop-update-tests
