name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Contract dependencies and external provider fixture
        shell: pwsh
        run: |
          python -m pip install -r spec/requirements.txt
          if ($LASTEXITCODE) { throw 'Python runtime dependencies failed' }
          npm ci --prefix tests --ignore-scripts
          if ($LASTEXITCODE) { throw 'Browser dependencies failed' }
          dotnet build spec/support/windows/CodexFixture.csproj -o tmp/codex-fixture
          if ($LASTEXITCODE) { throw 'Provider fixture build failed' }
      - name: Portable desktop package
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Service, CLI, browser and native contracts
        shell: pwsh
        run: |
          $package = '.build/Sapiens4-${{ matrix.runtime }}'
          $env:SAPIENS_TEST_CODEX = (Resolve-Path tmp/codex-fixture/CodexFixture.exe).Path
          $env:SAPIENS_TEST_WINDOWS_PACKAGE = (Resolve-Path $package).Path
          $env:SAPIENS_PYTHON = 'python'
          bundle exec rspec
          if ($LASTEXITCODE) { throw 'RSpec contracts failed' }
          & "$package/runtime/blindly4/.build/windows/blindly4.exe" --self-test
          if ($LASTEXITCODE) { throw 'Blindly4 checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Sapiens4-${{ matrix.runtime }}
          path: .build/Sapiens4-${{ matrix.runtime }}/
          include-hidden-files: true
