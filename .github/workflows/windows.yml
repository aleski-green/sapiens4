name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            rust-target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            runtime: win-arm64
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Python regressions
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -v
      - name: Frontend regressions
        shell: pwsh
        run: |
          npm ci --prefix tests --ignore-scripts
          python -c "from sapiens.corpora.host.assets import javascript; from pathlib import Path; Path('app-check.js').write_text(javascript(), encoding='utf-8')"
          node --check app-check.js
          if ($LASTEXITCODE) { throw 'JavaScript syntax failed' }
          foreach ($file in Get-ChildItem tests -Filter '*.test.cjs') {
            node $file.FullName
            if ($LASTEXITCODE) { throw "Frontend test failed: $file" }
          }
      - name: Portable desktop package
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Packaged Blindly4 CLI regressions
        working-directory: blindly4
        shell: pwsh
        run: |
          $env:BLINDLY4_BIN = Join-Path $env:GITHUB_WORKSPACE '.build/Sapiens4-${{ matrix.runtime }}/runtime/blindly4/.build/windows/blindly4.exe'
          bundle install
          if ($LASTEXITCODE) { throw 'Blindly4 test dependencies failed' }
          bundle exec rspec
          if ($LASTEXITCODE) { throw 'Packaged Blindly4 regressions failed' }
      - name: Native checks
        shell: pwsh
        run: |
          $package = '.build/Sapiens4-${{ matrix.runtime }}'
          & "$package/runtime/blindly4/.build/windows/blindly4.exe" schema
          if ($LASTEXITCODE) { throw 'Blindly4 checks failed' }
          $result = Join-Path $PWD 'navigation-results.json'
          $process = Start-Process -FilePath "$package/Sapiens4.exe" -ArgumentList @('--self-test', $result) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Get-Content $result | ConvertFrom-Json).ok) { throw 'Desktop navigation checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Sapiens4-${{ matrix.runtime }}
          path: .build/Sapiens4-${{ matrix.runtime }}/
          include-hidden-files: true
